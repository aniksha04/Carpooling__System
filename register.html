{% extends "base.html" %}
{% block title %}Register | CarpoolConnect{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create account</h1>
  <p class="muted">Register to offer or book rides.</p>
  <form method="POST" action="{{ url_for('register') }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" maxlength="100" required autocomplete="username">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="150" required autocomplete="email">
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
    <button class="button full-width" type="submit">Create Account</button>
  </form>
  <p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
