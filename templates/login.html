{% extends "base.html" %}
{% block title %}Login | CarpoolConnect{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Login</h1>
  <p class="muted">Enter your account details to continue.</p>
  <form method="POST" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="button full-width" type="submit">Login</button>
  </form>
  <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
