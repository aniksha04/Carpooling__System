{% extends "base.html" %}
{% block title %}Offer a Ride | CarpoolConnect{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">SHARE YOUR JOURNEY</p><h1>Offer a ride</h1>
  <form method="POST" action="{{ url_for('offer_ride') }}">
    <label for="source">Starting point</label>
    <input id="source" name="source" type="text" maxlength="150" required placeholder="e.g. Kolhapur">
    <label for="destination">Destination</label>
    <input id="destination" name="destination" type="text" maxlength="150" required placeholder="e.g. Pune">
    <label for="seats">Available seats (1–8)</label>
    <input id="seats" name="seats" type="number" min="1" max="8" required value="1">
    <button class="button full-width" type="submit">Post Ride</button>
  </form>
</section>
{% endblock %}
